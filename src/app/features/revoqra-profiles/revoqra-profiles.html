<app-admin-header/><main class="page-shell"><header><a routerLink="/revoqra/entitlements">← Plan entitlements</a><h1>Research Profiles</h1><p>Customer-facing metadata and credit costs. Technical model configuration remains separate.</p></header>@if(error()){<p class="state error">Unable to load or save profiles.</p>}@for(p of profiles();track p.profile){<section class="panel profile-form"><h2>{{p.profile}}</h2><label>Title<input [(ngModel)]="p.title"/></label><label>Short description<input [(ngModel)]="p.shortDescription"/></label><label>Long description<textarea rows="4" [(ngModel)]="p.longDescription"></textarea></label><div class="row"><label>Credit cost<input type="number" min="1" [(ngModel)]="p.creditCost"/></label><label>Display order<input type="number" min="0" [(ngModel)]="p.displayOrder"/></label><label class="check"><input type="checkbox" [(ngModel)]="p.enabled"/> Enabled</label></div><button (click)="save(p)" [disabled]="saving()===p.profile">{{saving()===p.profile?'Saving…':'Save'}}</button></section>}</main>
