<header class="topbar">
  <a class="brand" routerLink="/dashboard" aria-label="App Core Admin dashboard">
    <img src="/assets/appcore-logo.png" alt="" width="42" height="42" />
    <span>App Core Admin</span>
  </a>
  <nav aria-label="Primary navigation">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/analytics/events" routerLinkActive="active">Analytics</a>
    <a routerLink="/app-store/notifications" routerLinkActive="active">App Store</a>
    <a routerLink="/recipes" routerLinkActive="active">Recipes</a>
    <a routerLink="/recipe-extraction-domains" routerLinkActive="active">Extraction Domains</a>
    <a routerLink="/barcodes" routerLinkActive="active">Barcodes</a>
    <a routerLink="/brickset" routerLinkActive="active">Brickset</a>
    <a routerLink="/openai/usage" routerLinkActive="active">OpenAI</a>
    <a routerLink="/openai/deep-research" routerLinkActive="active">Research</a>
    <a routerLink="/openai/chat" routerLinkActive="active">Chat</a>
    <a routerLink="/openai/voice-inbox" routerLinkActive="active">Voice Inbox</a>
    <a routerLink="/openai/dish-recreation" routerLinkActive="active">Dish Recreation</a>
    <a routerLink="/openai/recipe-discovery" routerLinkActive="active">Recipe Discovery</a>
  </nav>
  <div class="header-actions">
    <label class="theme-picker">
      <span>Theme</span>
      <select [value]="theme.preference()" (change)="setTheme($event)" aria-label="Color theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <button type="button" class="logout" (click)="logout()" [disabled]="isLoggingOut()">
      {{ isLoggingOut() ? 'Signing out…' : 'Logout' }}
    </button>
  </div>
</header>
